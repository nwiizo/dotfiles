name: Update everything
command: |
  update_all
description: |
  Run the dotfiles `update_all` fish function — refreshes brew, mise
  tools, Claude CLI, rustup, and nvim plugins. Use flags such as
  `--no-brew`, `--no-rust`, or `--no-nvim` to skip slower parts.
tags:
  - dotfiles
  - update
shells:
  - fish
