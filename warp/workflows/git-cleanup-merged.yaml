name: Git cleanup merged branches
command: |
  sh -c '
    set -efu
    current_branch=$(git branch --show-current)
    if [ -z "$current_branch" ]; then
      echo "Git cleanup requires a checked-out branch" >&2
      exit 1
    fi

    IFS="
  "
    merged_branches=$(git branch --format="%(refname:short)" --merged=HEAD)
    for branch in $merged_branches; do
      case "$branch" in
        "$current_branch"|main|master|develop) continue ;;
      esac
      git branch -d -- "$branch"
    done
  '
description: |
  Delete local branches whose commits are already in the current branch
  (excluding main / master / develop). Refuses detached HEAD and uses `-d`,
  not `-D`.
tags:
  - git
  - cleanup
