name: Update everything
command: |
  update_all
description: |
  Run the dotfiles `update_all` fish function — refreshes brew, language
  toolchains, CLI package managers, Fish plugins, Mason tools, and Neovim
  plugins sequentially without password prompts. Mac App Store updates are
  skipped by default. Use `--parallel` for the faster but noisier mode, and
  `update_all --help` to see all flags.
tags:
  - dotfiles
  - update
shells:
  - fish
